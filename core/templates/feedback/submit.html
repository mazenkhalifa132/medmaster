{% extends 'base.html' %}

{% block content %}
<div class="mx-auto" style="max-width: 760px;">
    <div class="bg-white border shadow-sm rounded-4 p-4 p-md-5">
        <div class="d-flex align-items-center gap-3 mb-3">
            <div class="rounded-circle d-flex align-items-center justify-content-center text-white" style="width: 52px; height: 52px; background: #4f46e5;"><i class='bx bx-user-voice fs-3'></i></div>
            <div><h2 class="h3 fw-bold mb-1">Send feedback</h2><p class="text-muted mb-0">Your thoughts help us improve Med Master.</p></div>
        </div>
        {% if already_submitted %}
            <div class="alert alert-success mb-0"><i class='bx bx-check-circle me-2'></i>We received your feedback and are working on it. Thank you!</div>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <label for="message" class="form-label fw-semibold">Your feedback</label>
                <textarea class="form-control" id="message" name="message" rows="7" maxlength="5000" required placeholder="Tell us what is working well or what we can improve..."></textarea>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="hide_identity" name="hide_identity">
                    <label class="form-check-label" for="hide_identity">Hide my identity (send anonymously)</label>
                </div>
                <button class="btn btn-primary mt-4 px-4" type="submit"><i class='bx bx-send me-1'></i> Send feedback</button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
